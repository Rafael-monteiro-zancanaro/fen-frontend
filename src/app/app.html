<div class="app-shell flex min-h-screen flex-col">
  <header class="app-navbar">
    <div class="app-container flex flex-wrap items-center justify-between gap-4 py-3">
      <a
        class="flex items-center gap-3 font-semibold text-white"
        routerLink="/login"
        aria-label="Ir para login"
      >
        <span class="grid size-11 place-items-center rounded-md bg-white p-1 shadow-soft">
          <img class="size-9 object-contain" src="/uem-logo.png" alt="Logo da UEM" />
        </span>
        <span class="leading-tight">
          <span class="block">AtendeFEN</span>
          <span class="block text-xs font-medium text-white/75"
            >Sistema de Atendimentos Farmacêuticos da Farmácia Ensino da UEM</span
          >
        </span>
      </a>

      <nav
        class="flex flex-wrap items-center gap-1 text-sm font-semibold"
        aria-label="Navegacao principal"
      >
        @if (isInternalNavigation()) {
          <a class="rounded-md bg-white px-3 py-2 text-uem-800 shadow-soft" routerLink="/inicio">
            Inicio
          </a>
          <a
            class="rounded-md px-3 py-2 text-white/80 transition hover:bg-white/10 hover:text-white"
            routerLink="/atendimentos"
          >
            Atendimentos
          </a>
          <a
            class="rounded-md px-3 py-2 text-white/80 transition hover:bg-white/10 hover:text-white"
            routerLink="/atendimentos/busca-avancada"
          >
            Busca avançada
          </a>
          <a
            class="rounded-md px-3 py-2 text-white/80 transition hover:bg-white/10 hover:text-white"
            routerLink="/medicamentos"
          >
            Medicamentos
          </a>
          <a
            class="rounded-md px-3 py-2 text-white/80 transition hover:bg-white/10 hover:text-white"
            routerLink="/comorbidades"
          >
            Comorbidades
          </a>
          @if (canManagePasswordRecovery()) {
            <a
              class="rounded-md px-3 py-2 text-white/80 transition hover:bg-white/10 hover:text-white"
              routerLink="/admin/recuperacoes-senha"
            >
              Recuperações de senha
            </a>
            <a
              class="rounded-md px-3 py-2 text-white/80 transition hover:bg-white/10 hover:text-white"
              routerLink="/admin/funcionarios"
            >
              Funcionários
            </a>
          }
          <a
            class="rounded-md px-3 py-2 text-white/80 transition hover:bg-white/10 hover:text-white"
            routerLink="/pacientes"
          >
            Pacientes
          </a>
          <button
            type="button"
            data-action="logout"
            class="rounded-md px-3 py-2 text-white/80 transition hover:bg-white/10 hover:text-white"
            (click)="logout()"
          >
            Sair
          </button>
        } @else {
          <a
            class="rounded-md px-3 py-2 text-white/80 transition hover:bg-white/10 hover:text-white"
            routerLink="/login"
          >
            Login
          </a>
          <a
            class="rounded-md px-3 py-2 text-white/80 transition hover:bg-white/10 hover:text-white"
            routerLink="/cadastro"
          >
            Cadastro
          </a>
        }
      </nav>
    </div>
  </header>

  <router-outlet />
</div>
